plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.portsvetly.game'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.portsvetly.game'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs right away.
            // Use your own keystore before publishing anywhere.
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    // Must match the GameActivity version bundled by the android-activity crate.
    implementation 'androidx.games:games-activity:4.4.0'
}
