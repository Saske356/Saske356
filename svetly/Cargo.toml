[package]
name = "svetly"
version = "0.1.0"
edition = "2021"
description = "Port Svetly: an original open-world city game written in Rust"
publish = false

[lib]
name = "svetly"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "svetly"
path = "src/main.rs"

[dependencies]
bevy = { version = "=0.16.1", default-features = false, features = [
  "std",
  "async_executor",
  "multi_threaded",
  "bevy_asset",
  "bevy_core_pipeline",
  "bevy_pbr",
  "bevy_render",
  "bevy_text",
  "bevy_ui",
  "bevy_ui_picking_backend",
  "bevy_picking",
  "bevy_winit",
  "bevy_window",
  "bevy_state",
  "bevy_log",
  "default_font",
  "tonemapping_luts",
  "smaa_luts",
  "ktx2",
  "zstd",
  "png",
  "x11",
  "android-game-activity",
] }
rand = { version = "0.8", features = ["small_rng"] }

[features]
default = []

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
