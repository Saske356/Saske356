[package]
name = "svet"
version = "0.1.0"
edition = "2021"

[lib]
name = "svet"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "svet-desktop"
path = "src/main.rs"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
serde_json = "1"
libc = "0.2"
miniz_oxide = "0.8" # 4.8: сжатие кода переноса сохранения (уже был в сборке через png)

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true

[profile.dev.package."*"]
opt-level = 2
[profile.dev]
opt-level = 1
