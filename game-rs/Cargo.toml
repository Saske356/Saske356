[package]
name = "svet"
version = "0.1.0"
edition = "2021"

[lib]
name = "svet"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "svet-desktop"
path = "src/main.rs"

[dependencies]
macroquad = { version = "0.4" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
