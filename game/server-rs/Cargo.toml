[package]
name = "novograd-server"
version = "0.2.0"
edition = "2021"
description = "Игровой сервер Новоград RP на Rust: мультиплеер, экономика, работы, раздача клиента и кэша"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = "0.4"
mimalloc = { version = "0.1", default-features = false }
rand = "0.8"
scrypt = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
