[package]
name = "solara-city"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "=0.16.1", default-features = false, features = [
  "std",
  "bevy_asset",
  "bevy_core_pipeline",
  "bevy_pbr",
  "bevy_render",
  "bevy_text",
  "bevy_ui",
  "bevy_window",
  "bevy_winit",
  "bevy_log",
  "webgl2",
] }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
