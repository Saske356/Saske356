<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#517da2">
  <title>Telegraph</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== Auth ===== -->
  <section id="auth" class="auth hidden">
    <div class="auth-card">
      <img src="icon.svg" class="auth-logo" alt="">
      <h1>Telegraph</h1>
      <p class="muted" id="authHint">Войдите, чтобы продолжить</p>
      <div class="tabs">
        <button class="tab active" data-tab="login">Вход</button>
        <button class="tab" data-tab="register">Регистрация</button>
      </div>
      <form id="authForm" autocomplete="on">
        <label class="field reg-only hidden"><span>Имя</span><input name="name" maxlength="64" autocomplete="name"></label>
        <label class="field"><span>Имя пользователя</span><input name="username" maxlength="32" autocomplete="username" required></label>
        <label class="field"><span>Пароль</span><input name="password" type="password" minlength="6" autocomplete="current-password" required></label>
        <div class="error" id="authError"></div>
        <button class="btn primary wide" type="submit" id="authSubmit">Войти</button>
      </form>
    </div>
  </section>

  <!-- ===== App ===== -->
  <main id="app" class="app hidden">
    <aside class="sidebar">
      <header class="side-head">
        <button class="icon-btn" id="menuBtn" title="Меню">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" placeholder="Поиск" autocomplete="off">
        </div>
      </header>
      <div class="menu hidden" id="menu">
        <div class="menu-me" id="menuMe"></div>
        <button data-act="saved"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Избранное</button>
        <button data-act="group"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7M17 11a3 3 0 1 0 0-6M22 21c0-3-2-5.5-5-6"/></svg>Создать группу</button>
        <button data-act="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>Мой профиль</button>
        <button data-act="theme"><svg viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>Ночной режим</button>
        <button data-act="logout" class="danger"><svg viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 17l5-5-5-5M15 12H3"/></svg>Выйти</button>
      </div>
      <div class="conn hidden" id="conn">Соединение…</div>
      <div class="chat-list" id="chatList"></div>
      <button class="fab" id="fab" title="Новая группа">
        <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/></svg>
      </button>
    </aside>

    <section class="chat" id="chat">
      <div class="empty" id="emptyChat">
        <div class="pill">Выберите чат, чтобы начать общение</div>
      </div>
      <div class="chat-inner hidden" id="chatInner">
        <header class="chat-head">
          <button class="icon-btn back" id="backBtn" title="Назад">
            <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <div class="chat-head-info" id="chatHeadInfo">
            <div class="avatar" id="chatAvatar"></div>
            <div class="titles">
              <div class="title" id="chatTitle"></div>
              <div class="status" id="chatStatus"></div>
            </div>
          </div>
        </header>
        <div class="messages" id="messages"></div>
        <button class="to-bottom hidden" id="toBottom" title="Вниз">
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
          <span class="badge hidden" id="toBottomBadge"></span>
        </button>
        <footer class="composer-wrap">
          <div class="compose-ctx hidden" id="composeCtx">
            <svg viewBox="0 0 24 24" id="ctxIcon"><path d="M10 9V5l-7 7 7 7v-4c5 0 8.5 1.5 11 5-1-5-4-10-11-11z"/></svg>
            <div class="ctx-body"><div class="ctx-title" id="ctxTitle"></div><div class="ctx-text" id="ctxText"></div></div>
            <button class="icon-btn" id="ctxClose" title="Отмена"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
          </div>
          <div class="composer">
            <button class="icon-btn" id="attachBtn" title="Прикрепить файл">
              <svg viewBox="0 0 24 24"><path d="M21 11.5 12.5 20a5 5 0 0 1-7-7L14 4.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4L15.5 8"/></svg>
            </button>
            <input type="file" id="fileInput" hidden>
            <textarea id="input" rows="1" placeholder="Сообщение" maxlength="4096"></textarea>
            <button class="icon-btn send" id="sendBtn" title="Отправить">
              <svg viewBox="0 0 24 24"><path d="M3 20 21 12 3 4l3 8zM6 12h8"/></svg>
            </button>
          </div>
        </footer>
      </div>
    </section>
  </main>

  <div class="ctx-menu hidden" id="ctxMenu"></div>
  <div class="modal-back hidden" id="modalBack"><div class="modal" id="modal"></div></div>
  <div class="lightbox hidden" id="lightbox"><img id="lightboxImg" alt=""></div>
  <div class="toast hidden" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
