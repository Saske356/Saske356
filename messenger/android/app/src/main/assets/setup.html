<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Орбита</title>
<style>
  :root { --paper:#f4f1ea; --surface:#fffdf9; --ink:#1f1d24; --muted:#86818c; --line:#e4ded3; --accent:#ff5f3a; --bad:#e5484d; --warn:#fbf0dc; }
  @media (prefers-color-scheme: dark) { :root { --paper:#121116; --surface:#1b1a20; --ink:#f2eee6; --muted:#8d8893; --line:#2a2930; --warn:#2a2418; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 500 16px/1.45 system-ui, -apple-system, Roboto, sans-serif; color: var(--ink); background: var(--paper); display: flex; flex-direction: column; }
  .art { position: relative; height: 38vh; min-height: 220px; background: #17161b; overflow: hidden; border-radius: 0 0 32px 32px; }
  .ring { position: absolute; left: 50%; top: 55%; border: 1.5px solid rgba(244,241,234,.15); border-radius: 50%; transform: translate(-50%,-50%); animation: o linear infinite; }
  .ring i { position: absolute; top: -5px; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: #f4f1ea; }
  .r1 { width: 150px; height: 150px; animation-duration: 10s; } .r2 { width: 260px; height: 260px; animation-duration: 18s; animation-direction: reverse; } .r2 i { background: var(--accent); }
  .r3 { width: 380px; height: 380px; animation-duration: 30s; }
  .core { position: absolute; left: 50%; top: 55%; width: 64px; height: 64px; margin: -32px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff9a7a, var(--accent) 55%, #c63a1c); box-shadow: 0 0 80px rgba(255,95,58,.5); }
  @keyframes o { to { transform: translate(-50%,-50%) rotate(360deg); } }
  main { flex: 1; padding: 28px 22px 32px; max-width: 460px; width: 100%; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -.03em; }
  p { margin: 0 0 22px; color: var(--muted); }
  label span { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 0 0 6px 2px; }
  input { width: 100%; padding: 15px 16px; font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; outline: 0; }
  input:focus { border-color: var(--ink); }
  button { width: 100%; height: 54px; margin-top: 16px; border: 0; border-radius: 16px; background: var(--ink); color: var(--paper); font: 700 16px system-ui, sans-serif; }
  button.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); margin-top: 10px; }
  .err { display: none; padding: 12px 14px; border-radius: 12px; background: var(--warn); color: var(--ink); font-size: 14px; margin-bottom: 18px; }
  .err b { color: var(--bad); }
  .hint { font-size: 13px; margin-top: 18px; }
</style>
</head>
<body>
  <div class="art"><div class="ring r1"><i></i></div><div class="ring r2"><i></i></div><div class="ring r3"><i></i></div><div class="core"></div></div>
  <main>
    <h1 id="t">Добро пожаловать</h1>
    <p id="s">Укажите адрес сервера Орбиты — его даёт администратор вашего сообщества.</p>
    <div class="err" id="err"></div>
    <form id="f" novalidate>
      <label><span>Адрес сервера</span><input id="u" type="url" inputmode="url" autocapitalize="off" autocomplete="url" spellcheck="false" placeholder="https://orbita.example.com"></label>
      <button type="submit">Подключиться</button>
      <button type="button" class="ghost" id="retry" style="display:none">Повторить</button>
    </form>
    <p class="hint">Для звонков и голосовых сообщений нужен адрес с https://.</p>
  </main>
<script>
  const q = new URLSearchParams(location.hash.slice(1));
  const u = document.getElementById('u');
  u.value = q.get('error') || q.get('change') || (window.OrbitaAndroid && OrbitaAndroid.currentServer()) || '';
  if (q.get('error')) {
    document.getElementById('t').textContent = 'Нет связи';
    document.getElementById('s').textContent = 'Проверьте интернет или адрес сервера.';
    const e = document.getElementById('err');
    e.style.display = 'block';
    e.innerHTML = '<b>Не удалось открыть</b> ' + q.get('error').replace(/[<>&]/g, '') + '<br><small>' + (q.get('msg') || '').replace(/[<>&]/g, '') + '</small>';
    const r = document.getElementById('retry'); r.style.display = 'block'; r.onclick = () => OrbitaAndroid.retry();
  }
  document.getElementById('f').onsubmit = e => {
    e.preventDefault();
    const v = u.value.trim();
    if (!v) return u.focus();
    OrbitaAndroid.setServer(v);
  };
</script>
</body>
</html>
