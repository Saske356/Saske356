<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Орбита</title>
<style>
  :root { --bg:#07070d; --glass:rgba(22,22,34,.66); --ink:#f4f4f8; --muted:#8b8ba0; --line:rgba(255,255,255,.1); --accent:#ff5d7a; --bad:#ff5468; --warn:rgba(251,191,36,.12);
    --grad:linear-gradient(135deg,#ffa184,#ff5d7a 45%,#9b55ff); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 500 16px/1.45 system-ui, -apple-system, Roboto, sans-serif; color: var(--ink); background: var(--bg); display: flex; flex-direction: column; }
  body::before { content:""; position:fixed; inset:-20%; z-index:-1; background: radial-gradient(40% 40% at 20% 10%, rgba(124,92,255,.3), transparent 70%), radial-gradient(40% 40% at 85% 85%, rgba(255,93,122,.24), transparent 70%); filter: blur(20px); }
  .art { position: relative; height: 38vh; min-height: 220px; overflow: hidden; }
  .ring { position: absolute; left: 50%; top: 55%; border: 1px solid rgba(255,255,255,.14); border-radius: 50%; transform: translate(-50%,-50%); animation: o linear infinite; }
  .ring i { position: absolute; top: -5px; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: #fff; box-shadow: 0 0 16px 3px rgba(255,255,255,.5); }
  .r1 { width: 150px; height: 150px; animation-duration: 10s; } .r2 { width: 260px; height: 260px; animation-duration: 18s; animation-direction: reverse; } .r2 i { background: var(--accent); }
  .r3 { width: 380px; height: 380px; animation-duration: 30s; }
  .core { position: absolute; left: 50%; top: 55%; width: 64px; height: 64px; margin: -32px; border-radius: 50%; background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.45), transparent 40%), var(--grad); box-shadow: 0 0 90px 10px rgba(255,93,122,.45); }
  @keyframes o { to { transform: translate(-50%,-50%) rotate(360deg); } }
  main { margin: -30px 14px 24px; padding: 26px 22px 24px; max-width: 460px; align-self: center; width: calc(100% - 28px); border-radius: 28px; background: var(--glass); backdrop-filter: blur(28px); box-shadow: 0 24px 64px -16px rgba(0,0,0,.75), 0 0 0 1px var(--line); }
  h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -.03em; }
  p { margin: 0 0 22px; color: var(--muted); }
  label span { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 0 0 6px 2px; }
  input { width: 100%; padding: 15px 16px; font: inherit; color: var(--ink); background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 14px; outline: 0; }
  input:focus { border-color: rgba(255,93,122,.6); box-shadow: 0 0 0 4px rgba(255,93,122,.16); }
  button { width: 100%; height: 54px; margin-top: 16px; border: 0; border-radius: 16px; background: var(--grad); color: #fff; font: 700 16px system-ui, sans-serif; box-shadow: 0 10px 30px -10px rgba(255,93,122,.7); }
  button.ghost { background: rgba(255,255,255,.05); color: var(--ink); border: 1px solid var(--line); margin-top: 10px; box-shadow: none; }
  .err { display: none; padding: 12px 14px; border-radius: 12px; background: var(--warn); color: var(--ink); font-size: 14px; margin-bottom: 18px; }
  .err b { color: var(--bad); }
  .hint { font-size: 13px; margin-top: 18px; }
</style>
</head>
<body>
  <div class="art"><div class="ring r1"><i></i></div><div class="ring r2"><i></i></div><div class="ring r3"><i></i></div><div class="core"></div></div>
  <main>
    <h1 id="t">Добро пожаловать</h1>
    <p id="s">Укажите адрес сервера Орбиты — его даёт администратор вашего сообщества.</p>
    <div class="err" id="err"></div>
    <form id="f" novalidate>
      <label><span>Адрес сервера</span><input id="u" type="url" inputmode="url" autocapitalize="off" autocomplete="url" spellcheck="false" placeholder="https://orbita.example.com"></label>
      <button type="submit">Подключиться</button>
      <button type="button" class="ghost" id="retry" style="display:none">Повторить</button>
    </form>
    
  </main>
<script>
  const q = new URLSearchParams(location.hash.slice(1));
  const u = document.getElementById('u');
  u.value = q.get('error') || q.get('change') || (window.OrbitaAndroid && OrbitaAndroid.currentServer()) || '';
  if (q.get('error')) {
    document.getElementById('t').textContent = 'Нет связи';
    document.getElementById('s').textContent = 'Проверьте интернет или адрес сервера.';
    const e = document.getElementById('err');
    e.style.display = 'block';
    e.innerHTML = '<b>Не удалось открыть</b> ' + q.get('error').replace(/[<>&]/g, '') + '<br><small>' + (q.get('msg') || '').replace(/[<>&]/g, '') + '</small>';
    const r = document.getElementById('retry'); r.style.display = 'block'; r.onclick = () => OrbitaAndroid.retry();
  }
  document.getElementById('f').onsubmit = e => {
    e.preventDefault();
    const v = u.value.trim();
    if (!v) return u.focus();
    OrbitaAndroid.setServer(v);
  };
</script>
</body>
</html>
